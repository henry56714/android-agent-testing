[project]
name = "android-agent-testing"
version = "0.1.0"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "third_party/*"]
description = "Persistent, agent-friendly Android testing with native test tools"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6.0.2,<7", "jsonschema>=4.23,<5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project.scripts]
aat = "aat.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aat"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
