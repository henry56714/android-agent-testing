import groovy.json.JsonOutput
import org.gradle.api.tasks.testing.Test
import org.gradle.api.provider.Provider
import org.gradle.api.file.FileSystemLocation

// Read evaluated task outputs and variant/source-set relationships. Unknown
// adapters stay explicit gaps; there is no guessed build/reports fallback.
gradle.projectsEvaluated {
    rootProject.tasks.register('aatExportTestInventory') {
        doLast {
            def fileValue = { value ->
                if (value instanceof Provider) value = value.orNull
                if (value instanceof FileSystemLocation) value = value.asFile
                value instanceof File ? value : null
            }
            def sourceDirs = { sets ->
                def dirs = []
                sets.each { s ->
                    if (s.hasProperty('allSource')) dirs.addAll(s.allSource.srcDirs)
                    else {
                        dirs.addAll(s.java.srcDirs)
                        if (s.hasProperty('kotlin')) dirs.addAll(s.kotlin.srcDirs)
                    }
                }
                dirs.collect { it.absolutePath }.unique().sort()
            }
            def projects = []
            rootProject.allprojects.each { p ->
                def android = p.extensions.findByName('android')
                def nativeSets = android != null && android.hasProperty('sourceSets') ? android.sourceSets : p.extensions.findByName('sourceSets')
                def sourceSets = nativeSets == null ? [] : nativeSets.collect { s ->
                    [name: s.name, dirs: sourceDirs([s])]
                }
                def variantSources = [:]
                def pluginVersion = null
                if (android != null) {
                    try {
                        pluginVersion = Class.forName('com.android.Version', true, android.class.classLoader)
                            .getField('ANDROID_GRADLE_PLUGIN_VERSION').get(null)
                    } catch (Exception ignored) { }
                    try {
                        def variants = android.hasProperty('applicationVariants') ? android.applicationVariants : android.libraryVariants
                        variants.each { variant ->
                            if (variant.unitTestVariant != null) {
                                def test = variant.unitTestVariant
                                variantSources['test' + test.name.capitalize()] = sourceDirs(test.sourceSets)
                            }
                            if (variant.testVariant != null) {
                                def test = variant.testVariant
                                variantSources['connected' + test.name.capitalize()] = sourceDirs(test.sourceSets)
                            }
                        }
                    } catch (Exception ignored) { /* Missing variant API is an explicit mapping gap below. */ }
                }
                def tasks = []
                p.tasks.each { t ->
                    def item = [path: t.path, name: t.name, type: t.class.name, enabled: t.enabled,
                                hasActions: !t.actions.empty, reportOrigin: 'task-model']
                    if (t instanceof Test) {
                        item.kind = 'junit'
                        item.reports = [t.reports.junitXml.outputLocation.get().asFile.absolutePath + '/**/*.xml']
                        item.filters = [include: t.filter.includePatterns as List, exclude: t.filter.excludePatterns as List,
                                        fileInclude: t.includes as List, fileExclude: t.excludes as List]
                        item.xmlEnabled = t.reports.junitXml.required.get()
                        item.classDirs = t.testClassesDirs.files.collect { it.absolutePath }
                        if (android != null) {
                            item.sourceDirs = variantSources[t.name]
                            item.sourceOrigin = 'android-variant-model'
                        } else {
                            def matched = nativeSets == null ? [] : nativeSets.findAll { s ->
                                !s.output.classesDirs.files.intersect(t.testClassesDirs.files).empty
                            }
                            item.sourceDirs = matched.empty ? null : sourceDirs(matched)
                            item.sourceOrigin = 'test-class-directories'
                        }
                    } else if (android != null && t.name ==~ /connected.+AndroidTest/ && t.name != 'connectedAndroidTest') {
                        item.kind = 'gradle-device'
                        def selectionArgs = ['class', 'notClass', 'package', 'notPackage', 'annotation',
                                             'notAnnotation', 'size', 'numShards', 'shardIndex', 'log', 'debug', 'tests_regex']
                        item.filters = [runner: selectionArgs.findAll { key ->
                            android.defaultConfig.testInstrumentationRunnerArguments.containsKey(key) ||
                            p.findProperty('android.testInstrumentationRunnerArguments.' + key) != null
                        }]
                        def results = t.hasProperty('resultsDir') ? fileValue(t.resultsDir) : null
                        item.reports = results == null ? [] : [results.absolutePath + '/**/*.xml']
                        item.sourceDirs = variantSources[t.name]
                        item.sourceOrigin = 'android-variant-model'
                    } else if (android != null && t.name ==~ /lint[A-Z].*/ && !(t.name ==~ /lint(Vital|Fix|Analyze|Report).*/)
                            && t.group == 'verification') {
                        item.kind = 'lint'
                        def reportTask = p.tasks.findByName('lintReport' + t.name.substring(4))
                        def xml = reportTask != null && reportTask.hasProperty('xmlReportOutputFile') ? fileValue(reportTask.xmlReportOutputFile) : null
                        item.reports = xml == null ? [] : [xml.absolutePath]
                        item.xmlEnabled = reportTask != null && reportTask.hasProperty('xmlReportEnabled') && reportTask.xmlReportEnabled.get()
                        item.reportTask = reportTask == null ? null : reportTask.path
                    } else if (t.group == 'verification' || ((t instanceof Exec || t instanceof JavaExec)
                               && t.name.toLowerCase().matches('.*(test|check).*'))) {
                        item.kind = 'verification'
                    } else { return }
                    if (item.kind in ['junit', 'gradle-device'] && item.sourceDirs == null) item.sourceOrigin = 'unavailable'
                    if (item.kind != 'verification' && item.reports.empty) item.reportOrigin = 'unavailable'
                    tasks.add(item)
                }
                projects.add([path: p.path, directory: p.projectDir.absolutePath,
                    android: android != null, androidPluginVersion: pluginVersion, sources: sourceSets, tasks: tasks])
            }
            def out = new File(System.getProperty('aat.inventory.output'))
            out.parentFile.mkdirs()
            out.text = JsonOutput.prettyPrint(JsonOutput.toJson([schema_version: 1, model_version: 2,
                gradleVersion: gradle.gradleVersion, projects: projects,
                includedBuilds: gradle.includedBuilds.collect { it.projectDir.absolutePath }]))
        }
    }
}
